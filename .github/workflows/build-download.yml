name: Build and download app

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Upload web app
        uses: actions/upload-artifact@v4
        with:
          name: thread-wardrobe-web
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Flutter Android project
        run: flutter create --org com.thread --project-name thread_wardrobe --platforms android mobile_app_build

      - name: Copy native app source
        run: |
          cp mobile_app/pubspec.yaml mobile_app_build/pubspec.yaml
          rm -rf mobile_app_build/lib mobile_app_build/test
          cp -R mobile_app/lib mobile_app_build/lib
          cp -R mobile_app/test mobile_app_build/test

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: mobile_app_build

      - name: Test native app
        run: flutter test
        working-directory: mobile_app_build

      - name: Build native Android debug APK
        run: flutter build apk --debug
        working-directory: mobile_app_build

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: thread-wardrobe-android-debug
          path: mobile_app_build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
